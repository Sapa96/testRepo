version: "1.0"
ruleGroups:
  - name: "Maven Build Error"
    conditionExpression:
      operator: "AND"
      conditions:
        - key: "standardOutput"
          operand: "contains"
          value: "BUILD FAILED"
        - key: "errorCode"
          operand: "is"
          value: 1
    actions:
      - type: "setErrorCategory"
        value: "APPLICATION_FAILURE"
      - type: "setErrorSubcategory"
        value: "DEPENDENCY_RESOLUTION_FAILED"
      - type: "setErrorMessage"
        value: "Maven build failed — check pom.xml and resolve dependency issues."

  - name: "NPM Dependency Error"
    conditionExpression:
      operator: "AND"
      conditions:
        - key: "standardErrorOutput"
          operand: "contains"
          value: "npm ERR!"
        - key: "standardErrorOutput"
          operand: "contains"
          value: "404"
    actions:
      - type: "setErrorCategory"
        value: "APPLICATION_FAILURE"
      - type: "setErrorSubcategory"
        value: "DEPENDENCY_ISSUE"
      - type: "setErrorMessage"
        value: "NPM dependency not found — verify package names and registry configuration."

  - name: "Out of Memory"
    conditionExpression:
      operator: "OR"
      conditions:
        - key: "standardErrorOutput"
          operand: "contains"
          value: "heap out of memory"
        - key: "standardErrorOutput"
          operand: "contains"
          value: "Killed"
    actions:
      - type: "setErrorCategory"
        value: "RESOURCE_LIMITS_FAILURE"
      - type: "setErrorSubcategory"
        value: "CONTAINER_OOM_KILLED"
      - type: "setErrorMessage"
        value: "Process killed due to out-of-memory — increase memory limits for this step."

  - name: "Docker Permission Error"
    conditionExpression:
      key: "standardErrorOutput"
      operand: "regex"
      value: "permission denied.*docker\\.sock"
    actions:
      - type: "setErrorCategory"
        value: "INFRASTRUCTURE_FAILURE"
      - type: "setErrorSubcategory"
        value: "FILE_SYSTEM_PERMISSION_ERROR"
      - type: "setErrorMessage"
        value: "Docker socket permission denied — ensure the user has access to /var/run/docker.sock."

  - name: "Compilation Error"
    conditionExpression:
      key: "standardOutput"
      operand: "regex"
      value: "\\[ERROR\\].*compilation failed"
    actions:
      - type: "setErrorCategory"
        value: "APPLICATION_FAILURE"
      - type: "setErrorSubcategory"
        value: "EXECUTION_FAILURE"
      - type: "setErrorMessage"
        value: "Source compilation failed — fix the reported code errors and retry."

  - name: "Infrastructure Connection Error"
    conditionExpression:
      operator: "OR"
      conditions:
        - operator: "AND"
          conditions:
            - key: "standardErrorOutput"
              operand: "contains"
              value: "connection refused"
            - key: "standardErrorOutput"
              operand: "contains"
              value: "5432"
        - operator: "AND"
          conditions:
            - key: "standardErrorOutput"
              operand: "contains"
              value: "connection timed out"
            - key: "standardErrorOutput"
              operand: "contains"
              value: "redis"
    actions:
      - type: "setErrorCategory"
        value: "CONNECTIVITY_FAILURE"
      - type: "setErrorSubcategory"
        value: "CONNECTION_REFUSED"
      - type: "setErrorMessage"
        value: "Service connection failed — verify the target host is reachable and accepting connections."

  - name: "Unknown Test Failure"
    conditionExpression:
      operator: "AND"
      conditions:
        - key: "standardOutput"
          operand: "contains"
          value: "FAILED"
        - key: "standardOutput"
          operand: "doesNotMatch"
          value: "BUILD"
        - key: "errorCode"
          operand: "isNot"
          value: 0
    actions:
      - type: "setErrorCategory"
        value: "VERIFICATION_FAILURE"
      - type: "setErrorSubcategory"
        value: "UNIT_TESTS_FAILED"
      - type: "setErrorMessage"
        value: "Test suite failed — review the failing test cases and fix assertions."

  - name: "Deploy Step Failure"
    conditionExpression:
      operator: "AND"
      conditions:
        - key: "stepId"
          operand: "contains"
          value: "deploy"
        - key: "errorCode"
          operand: "isNot"
          value: 0
    actions:
      - type: "setErrorCategory"
        value: "APPLICATION_FAILURE"
      - type: "setErrorSubcategory"
        value: "PIPELINE_EXECUTION_FAILED"
      - type: "setErrorMessage"
        value: "Deployment step failed — check deployment logs for rollback details."

  - name: "Deep Nested Auth Error"
    conditionExpression:
      operator: "OR"
      conditions:
        - operator: "AND"
          conditions:
            - operator: "OR"
              conditions:
                - key: "standardErrorOutput"
                  operand: "contains"
                  value: "401 Unauthorized"
                - key: "standardErrorOutput"
                  operand: "contains"
                  value: "403 Forbidden"
            - key: "standardOutput"
              operand: "contains"
              value: "authentication"
        - key: "standardErrorOutput"
          operand: "regex"
          value: "token.*expired"
    actions:
      - type: "setErrorCategory"
        value: "AUTHENTICATION_FAILURE"
      - type: "setErrorSubcategory"
        value: "UNAUTHORIZED"
      - type: "setErrorMessage"
        value: "Authentication failed — refresh or regenerate the expired token."
